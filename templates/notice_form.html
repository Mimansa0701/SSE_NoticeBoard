{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <div class="glass-card form-card">
        <h2>{{ action }} Notice</h2>
        
        <form method="POST" action="{{ url_for('create_notice') if action == 'Create' else url_for('edit_notice', notice_id=notice.id) }}" class="notice-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" required value="{{ notice.title if notice else '' }}">
            </div>
            
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" class="form-control" rows="6" required>{{ notice.content if notice else '' }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="department">Department</label>
                    <select id="department" name="department" class="form-control">
                        <option value="All" {% if notice and notice.department == 'All' %}selected{% endif %}>All Departments</option>
                        <option value="Computer Science" {% if notice and notice.department == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                        <option value="Electrical Engineering" {% if notice and notice.department == 'Electrical Engineering' %}selected{% endif %}>Electrical Engineering</option>
                        <option value="General" {% if notice and notice.department == 'General' %}selected{% endif %}>General</option>
                    </select>
                </div>
                
                <div class="form-group half">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control">
                        <option value="Academic" {% if notice and notice.category == 'Academic' %}selected{% endif %}>Academic</option>
                        <option value="Exam" {% if notice and notice.category == 'Exam' %}selected{% endif %}>Exam</option>
                        <option value="Event" {% if notice and notice.category == 'Event' %}selected{% endif %}>Event</option>
                        <option value="Urgent" {% if notice and notice.category == 'Urgent' %}selected{% endif %}>Urgent</option>
                        <option value="General" {% if notice and notice.category == 'General' %}selected{% endif %}>General</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" class="form-control">
                        <option value="Normal" {% if notice and notice.priority == 'Normal' %}selected{% endif %}>Normal</option>
                        <option value="High" {% if notice and notice.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Urgent" {% if notice and notice.priority == 'Urgent' %}selected{% endif %}>Urgent</option>
                    </select>
                </div>
                
                <div class="form-group half">
                    <label for="scheduled_at">Schedule Publication (Optional)</label>
                    <input type="datetime-local" id="scheduled_at" name="scheduled_at" class="form-control" value="{{ notice.scheduled_at.replace(' ', 'T') if notice and notice.scheduled_at else '' }}">
                    <small class="help-text">Leave blank to publish immediately.</small>
                </div>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="btn-outline">Cancel</a>
                <button type="submit" class="btn-primary">Save Notice</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
