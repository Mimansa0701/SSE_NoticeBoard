{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your credentials to access the notice board</p>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="e.g. student_cs">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary full-width">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
