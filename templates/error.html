{% extends "base.html" %}
{% block content %}
<div class="error-container">
    <div class="glass-card error-card text-center">
        <h1 class="error-code">{{ error_code }}</h1>
        <p class="error-message">{{ message }}</p>
        <a href="{{ url_for('dashboard') }}" class="btn-primary mt-4 inline-block">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
